<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlickCue on the web: your watchlist, reminders and what to watch next, synced with the extension and the Android app." />
    <meta name="theme-color" content="#0b0d0f" />
    <!-- Posters come from TMDB's image host: open that connection before the first one is asked for. -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./app-icon-180.png" />
    <!-- Addable to a phone's home screen, where iOS allows a site's notifications. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="FlickCue" />
    <link rel="canonical" href="https://flickcue.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlickCue" />
    <meta property="og:url" content="https://flickcue.in/" />
    <meta property="og:title" content="FlickCue — One watchlist. Everywhere." />
    <meta property="og:description" content="Save films and shows wherever you find them, get reminded when it's time to watch, and keep one list across Chrome and the web." />
    <meta property="og:image" content="https://flickcue.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The body font and the italic accent are needed for the first paint: fetched before the stylesheet asks for them. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/archivo-variable-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/instrument-serif-400italic-latin.woff2" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <script src="./theme.js"></script>
    <title>FlickCue — One watchlist. Everywhere.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
