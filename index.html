<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlickCue on the web: your watchlist, reminders and what to watch next, synced with the extension and the Android app." />
    <meta name="theme-color" content="#0b0d0f" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./flickcue-extension-icon.png" />
    <link rel="canonical" href="https://flickcue.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlickCue" />
    <meta property="og:url" content="https://flickcue.in/" />
    <meta property="og:title" content="FlickCue — One watchlist. Everywhere." />
    <meta property="og:description" content="Save films and shows wherever you find them, get reminded when it's time to watch, and keep one list across Chrome and the web." />
    <meta property="og:image" content="https://flickcue.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <script>
      // The reader's light/dark pick (src/lib/theme.ts), set before the first paint.
      try {
        var theme = localStorage.getItem("flickcue.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
    <title>FlickCue — One watchlist. Everywhere.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
