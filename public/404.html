<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0d0f" />
    <!-- GitHub Pages serves this for any missing path, so links are root-absolute. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Page not found · FlickCue</title>
    <style>
      :root { --bg: #f4f1ea; --ink: #16181b; --muted: #5d6166; --lime: #d7ff86; --on-lime: #16181b; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #111315; --ink: #eceae4; --muted: #a3a6aa; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.6 "Archivo", system-ui, sans-serif; }
      main { max-width: 560px; padding: 48px 16px; }
      .dots { display: inline-flex; gap: 4px; }
      .dots i { width: 10px; height: 10px; border-radius: 50%; }
      .code { margin: 32px 0 0; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; letter-spacing: 0.12em; color: var(--muted); }
      h1 { margin: 8px 0 12px; font-size: clamp(36px, 8vw, 56px); line-height: 1; letter-spacing: -0.035em; font-weight: 800; }
      p { margin: 0 0 28px; color: var(--muted); }
      a.button { display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 999px; background: var(--lime); color: var(--on-lime); font-weight: 700; text-decoration: none; }
      a.button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="dots" aria-hidden="true"><i style="background:#64d48a"></i><i style="background:#ff8c45"></i><i style="background:#55a9ff"></i></span>
      <p class="code">404</p>
      <h1>This page isn't here.</h1>
      <p>The link may be old or mistyped. Your watchlist is fine.</p>
      <a class="button" href="/">Go to FlickCue</a>
    </main>
  </body>
</html>
